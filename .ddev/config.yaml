name: dibs
type: php
docroot: ""
php_version: "8.4"
webserver_type: nginx-fpm
database:
  type: postgres
  version: "18"
nodejs_version: "22"

hooks:
  post-start:
    - exec: composer install
    # The suite runs against real Postgres (the schema uses uuidv7() column
    # defaults, which SQLite cannot express) on a database of its own.
    - exec: psql -h db -U db -d db -tc "SELECT 1 FROM pg_database WHERE datname = 'testing'" | grep -q 1 || psql -h db -U db -d db -c "CREATE DATABASE testing"
